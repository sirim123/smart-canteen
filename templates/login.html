{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <span class="eyebrow">WELCOME BACK</span><h1>Login to CampusBite</h1>
  <p class="muted">Access your student or administrator account.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email address<input type="email" name="email" required autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="button primary full" type="submit">Login</button>
  </form>
  <p class="muted center">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
</section></div>
{% endblock %}
